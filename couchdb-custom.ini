; CouchDB 3.5.3 configuration.
;
; Every difference from the previous CouchDB 1.7.1 configuration is annotated
; below, so the upgrade stays reviewable.

[vhosts]
; Still works in 3.x, but deprecated in 3.0 and removed in 4.0.
traduxio.domain.cdn = /traduxio/_design/traduxio/_rewrite

[log]
; The 1.x file set `file = /usr/local/var/log/couchdb/couch.log`. The 3.x image
; lives under /opt/couchdb so that path does not exist; stderr is also what
; docker wants, so that `docker compose logs` shows anything at all.
writer = stderr
level = info

[couchdb]
; Kept from 1.x: views/concordance/map.js can emit a very large number of keys
; for a single document, and the 5000 ms default is not enough.
os_process_timeout = 30000
; Create _users and _replicator on startup. On 1.x these were implicit; 3.x
; abolished the admin party and does not create them for a config-file admin.
single_node = true
; 3.4+ can run the query server on quickjs instead of spidermonkey. Pin it
; rather than inherit a future image default: the two differ on sloppy-mode and
; Annex-B behaviour that this design doc still relies on (see updates/glossary.js).
js_engine = spidermonkey

[chttpd]
; Was `[httpd] changes_timeout` on 1.x. From 2.x the clustered port (5984) is
; served by chttpd; [httpd] configured the node-local 5986 port, which 3.x
; removed entirely. Pairs with the longpoll _changes rewrite in rewrites.json.
changes_timeout = 29500

[query_server_config]
os_process_limit = 40

; Dropped from the 1.x file:
;   [replicator] max_replication_retry_count - the 1.x replicator was replaced
;   by the scheduling replicator in 2.0, and this key is now silently ignored.
;   Its 3.x counterparts are max_jobs / interval / max_churn /
;   retries_per_request. Nothing in TraduXio configures replication, so there
;   is nothing to carry over.

[csp]
; CouchDB 3.x sends `Content-Security-Policy: sandbox` on _show/_list responses
; and on attachments by default. CouchDB 1.7.1 sent no CSP at all, and a bare
; `sandbox` blocks ALL script execution - which kills the entire TraduXio UI
; (jQuery never defines itself, so login.js, works.js, activity.js and the
; hexapla editor never run). The server-rendered HTML still appears, which is
; why this is easy to miss: the site looks fine and is completely inert.
;
; The token list had to be discovered by use, which is an argument against this
; approach: a first version without `allow-modals` looked fine until someone
; tried to delete a work, because `sandbox` silently swallows confirm() and
; alert() ("Ignored call to 'confirm()'"). What the couchapp needs:
;   allow-scripts       all of the client JS
;   allow-same-origin   XHR to the database, and the AuthSession cookie
;   allow-forms         login, concordance search, metadata forms
;   allow-popups        window.open in _attachments/js/traduxio.js
;   allow-modals        confirm() for delete/share, alert() in 20 places
;
; Caveat worth recording: `allow-scripts` together with `allow-same-origin`
; lets the document remove its own sandbox, so this is already close to not
; having the header at all. Setting
;   showlist_enable = false
;   attachments_enable = false
; removes it outright and is arguably more honest (verified: the header then
; disappears). Either way this restores 1.7.1 behaviour rather than regressing
; from it. The proper fix is a real policy - script-src/style-src naming the
; couchapp's own origin - instead of leaning on sandbox at all. TraduXio
; renders user-submitted translations, so that deserves doing before any public
; 3.x deployment.
showlist_header_value = sandbox allow-scripts allow-same-origin allow-forms allow-popups allow-modals
attachments_header_value = sandbox allow-scripts allow-same-origin allow-forms allow-popups allow-modals
